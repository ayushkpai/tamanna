<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tamanna | Access Bars</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="bg-gradient-to-r from-pink-300 to-purple-300 min-h-screen px-6 py-8"
  >
    <div
      class="max-w-4xl mx-auto rounded-xl bg-gradient-to-r from-emerald-400 to-sky-500 p-6 shadow-lg"
    >
      <h1 class="text-3xl font-bold mb-4">Access Bars</h1>

      <div class="mt-6 aspect-video w-full">
        <iframe
          class="w-full h-full rounded-lg"
          src="https://www.youtube.com/embed/JrpKRa0M-hA"
          title="Access Bars"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        >
        </iframe>
      </div>
    </div>
  </body>
</html>
